name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Tests
        run: node test/run-tests.js

  validate:
    name: validate plugin
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build plugin
        run: node promptimizer/install/build-plugin.js
      - name: Install Claude Code CLI (CI only)
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin artifact
        run: claude plugin validate dist/marketplace/promptimizer
